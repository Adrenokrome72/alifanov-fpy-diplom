version: '3.8'

services:
  db:
    image: postgres:18
    container_name: mycloud_postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 20s
      timeout: 20s
      retries: 5
    networks:
      - mycloud_network

  backend:
    build:
      context: ..
      dockerfile: ./infra/dockerfiles/backend.dockerfile
    container_name: mycloud_backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS=nginx,backend,localhost,127.0.0.1
      - CORS_ALLOWED_ORIGINS=http://localhost,http://127.0.0.1,http://frontend
      - CSRF_TRUSTED_ORIGINS=http://localhost,http://127.0.0.1,http://frontend
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ../backend/backend/media:/app/backend/media
      - staticfiles:/app/staticfiles
    command: >
      sh -c "
        python manage.py makemigrations &&
        python manage.py migrate &&
        python manage.py create_superuser_if_not_exists &&
        python manage.py runserver 0.0.0.0:8000
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mycloud_network

  frontend:
    build:
      context: ..
      dockerfile: ./infra/dockerfiles/frontend.dockerfile
    container_name: mycloud_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - mycloud_network

  nginx:
    build:
      context: ..
      dockerfile: ./infra/dockerfiles/nginx.dockerfile
    container_name: mycloud_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    volumes:
      - staticfiles:/usr/share/nginx/static
      - ../backend/backend/media:/usr/share/nginx/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - mycloud_network

volumes:
  db_data:
    name: mycloud_db_data
  staticfiles:
    name: mycloud_staticfiles

networks:
  mycloud_network:
    driver: bridge
